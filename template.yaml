  ## Push

  GetVapidPublicKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-vapid-public-key.getVapidPublicKeyHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Description: emails-email-api get VAPID public key
      Policies:
        - AWSLambdaBasicExecutionRole
        # The public key ARN only. SSM_VAPID_PRIVATE_KEY_PATH is deliberately absent from this
        # function's Environment.Variables as well.
        - Version: 2012-10-17
          Statement:
            - Action: ['ssm:GetParameter']
              Effect: Allow
              Resource:
                - !Sub
                  - 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Path}'
                  - Path: !FindInMap [EnvironmentMap, !Ref Environment, vapidPublicKeyPath]
      Environment:
        Variables:
          SSM_VAPID_PUBLIC_KEY_PATH: !FindInMap [EnvironmentMap, !Ref Environment, vapidPublicKeyPath]
      Events:
        Http:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /vapid-public-key
            Method: get
      Tags:
        'created-by': 'emails-email-api'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 10
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-vapid-public-key.ts

