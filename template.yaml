            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PushSubscriptionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceivedTable
        - Version: 2012-10-17
          Statement:
            - Action: ['ssm:GetParameter']
              Effect: Allow
              Resource:
                - !Sub
                  - 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Path}'
                  - Path: !FindInMap [EnvironmentMap, !Ref Environment, vapidPrivateKeyPath]
                - !Sub
                  - 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Path}'
                  - Path: !FindInMap [EnvironmentMap, !Ref Environment, vapidPublicKeyPath]
      Environment:
        Variables:
          DYNAMODB_ACCOUNTS_TABLE_NAME: !Ref AccountTable
          DYNAMODB_PUSH_SUBSCRIPTIONS_TABLE_NAME: !Ref PushSubscriptionTable
          DYNAMODB_RECEIVED_TABLE_NAME: !Ref ReceivedTable
          # web-push emits Node's DEP0169 (url.parse) deprecation warning on stderr, which
          # CloudWatch records on every send.
          NODE_OPTIONS: --no-deprecation
          SSM_VAPID_PRIVATE_KEY_PATH: !FindInMap [EnvironmentMap, !Ref Environment, vapidPrivateKeyPath]
          SSM_VAPID_PUBLIC_KEY_PATH: !FindInMap [EnvironmentMap, !Ref Environment, vapidPublicKeyPath]
          VAPID_SUBJECT:
            !Sub ['mailto:do-not-reply@${Domain}', Domain: !FindInMap [EnvironmentMap, !Ref Environment, domainEmail]]
      Events:
        # Internal-only, like PutReceivedEmailFunction: registered as an ApiKey event and never as
        # an Http event. The neighbouring .../bounce route is on both doors because the UI calls it;
        # that is not the precedent here.
        ApiKey:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts/{accountId}/emails/received/{emailId}/notify
            Method: post
            Auth:
              ApiKeyRequired: true
