          KeyType: HASH
        - AttributeName: MessageID
          KeyType: RANGE
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, tableSent]
      Tags:
        - Key: 'created-by'
          Value: 'emails-email-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
