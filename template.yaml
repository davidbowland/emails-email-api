  # Database

  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: Account
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Account
          KeyType: HASH
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, tableAccounts]
      Tags:
        - Key: 'created-by'
          Value: 'emails-email-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  # Unlike ReceivedTable/SentTable this is HASH-only -- one item per account, Data holding a JSON
  # array of subscriptions.
  PushSubscriptionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: Account
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Account
          KeyType: HASH
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, tablePushSubscriptions]
      Tags:
        - Key: 'created-by'
          Value: 'emails-email-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  ReceivedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: Account
          AttributeType: S
        - AttributeName: MessageID
          AttributeType: S
        - AttributeName: Timestamp
          AttributeType: N
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: Account
              KeyType: HASH
            - AttributeName: Timestamp
              KeyType: RANGE
          Projection:
            NonKeyAttributes:
              - MessageID
            ProjectionType: INCLUDE
      KeySchema:
        - AttributeName: Account
          KeyType: HASH
        - AttributeName: MessageID
          KeyType: RANGE
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, tableReceived]
      Tags:
        - Key: 'created-by'
          Value: 'emails-email-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  SentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: Account
          AttributeType: S
        - AttributeName: MessageID
          AttributeType: S
        - AttributeName: Timestamp
          AttributeType: N
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: Account
              KeyType: HASH
            - AttributeName: Timestamp
              KeyType: RANGE
          Projection:
            NonKeyAttributes:
              - MessageID
            ProjectionType: INCLUDE
      KeySchema:
